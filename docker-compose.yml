version: '3.8'

services:
  rag_agent_openai:
    build:
      context: ./rag_agent
      dockerfile: Dockerfile
    container_name: rag_agent_openai
    env_file: .env
    ports:
      - "10000:10000"
    volumes:
      - ./rag_agent:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      mcp_server_openai:
        condition: service_healthy
    command: [ "python", "__main__.py" ]

  sql_agent_openai:
    build:
      context: ./sql_agent
      dockerfile: Dockerfile
    container_name: sql_agent_openai
    env_file: .env
    ports:
      - "10001:10001"
    volumes:
      - ./sql_agent:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      mcp_server_openai:
        condition: service_healthy
    command: [ "python", "__main__.py" ]

  graph_agent_openai:
    build:
      context: ./graph_agent
      dockerfile: Dockerfile
    container_name: graph_agent_openai
    env_file: .env
    ports:
      - "10003:10003"
    volumes:
      - ./graph_agent:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      mcp_server_openai:
        condition: service_healthy
    command: [ "python", "__main__.py" ]

  host_agent_openai:
    build:
      context: ./host_agent
      dockerfile: Dockerfile
    container_name: host_agent_openai
    env_file: .env
    ports:
      - "10002:10002"
    volumes:
      - ./host_agent:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - rag_agent_openai
      - sql_agent_openai
      - graph_agent_openai
      - sql_executor_agent_openai
      - pdf_agent_openai
    command: [ "python", "__main__.py" ]

  sql_executor_agent_openai:
    build:
      context: ./sql_executor_agent
      dockerfile: Dockerfile
    container_name: sql_executor_agent_openai
    env_file: .env
    ports:
      - "10004:10004"
    volumes:
      - ./sql_executor_agent:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HOST_DB=db
      - USER_DB=${USER_DB:-user_rag}
      - PASS_DB=${PASS_DB:-pass_rag}
      - DATABASE_DB=${DATABASE_DB:-rag_db}
      - PORT_DB=5432
    depends_on:
      db:
        condition: service_healthy
    command: [ "python", "__main__.py" ]

  pdf_agent_openai:
    build:
      context: ./pdf_agent
      dockerfile: Dockerfile
    container_name: pdf_agent_openai
    env_file: .env
    ports:
      - "10005:10005"
    volumes:
      - ./pdf_agent:/app
      - ./frontend/public/reports:/app/reports
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: [ "python", "__main__.py" ]

  mcp_server_openai:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: mcp_server_openai
    env_file: .env
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import socket;s=socket.socket();s.settimeout(2);s.connect(('localhost',8080));s.close()\"" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1200s
    volumes:
      - ./mcp_server:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
      - PORT=8080
      - QDRANT_URL=http://qdrant_openai:6333
      - NEO4J_URI=bolt://neo4j_graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testpassword
    depends_on:
      qdrant_openai:
        condition: service_healthy
      neo4j_graph:
        condition: service_healthy

  db:
    container_name: postgres_rag_openai
    image: postgres:latest
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${USER_DB:-user_rag}
      - POSTGRES_PASSWORD=${PASS_DB:-pass_rag}
      - POSTGRES_DB=${DATABASE_DB:-rag_db}
      - PGPASSWORD=${PASS_DB:-pass_rag}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./DB/restore.sh:/docker-entrypoint-initdb.d/restore.sh
      - ./DB/backup_db.dump:/tmp/backup_db.dump
    command: postgres -c max_wal_size=4GB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER_DB:-user_rag} -d ${DATABASE_DB:-rag_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1200s

  qdrant_openai:
    image: qdrant/qdrant:latest
    container_name: qdrant_openai
    ports:
      - 6337:6333
      - 6338:6334
    expose:
      - 6337
      - 6338
      - 6339
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 1200s

  frontend_openai:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_openai
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app
    environment:
      - AGENT_URL=http://host_agent_openai:10002/
    depends_on:
      - host_agent_openai

  neo4j_graph:
    image: neo4j:latest
    container_name: neo4j_graph
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/testpassword
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "neo4j-admin server status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 1200s

volumes:
  postgres_data:
  neo4j_data:
